<section id="projects" class="py-8 md:py-12 relative">
  <div class="max-w-7xl mx-auto px-4 md:px-8">
    <h2 class="section-title reveal" data-i18n="projects_title">Projects</h2>

    <div class="relative mt-8">
      <div id="project-carousel"
           class="relative h-[420px] sm:h-[460px] md:h-[520px] flex items-center justify-center overflow-hidden"
           tabindex="0"
           role="region"
           aria-roledescription="carousel"
           aria-label="Project carousel">

        <div id="projects-track" class="projects-track flex items-center w-full">
          <!-- Slides được tạo từ js/projects.js -->
        </div>

        <button id="prev-btn"
          type="button"
          aria-label="Previous project"
          class="absolute left-3 sm:left-6 md:left-8 top-1/2 -translate-y-1/2
                 w-9 h-9 sm:w-11 sm:h-11 md:w-12 md:h-12
                 bg-black/70 hover:bg-black/90 backdrop-blur-md rounded-2xl
                 flex items-center justify-center text-white text-2xl md:text-3xl z-30 shadow-lg">
          ←
        </button>

        <button id="next-btn"
          type="button"
          aria-label="Next project"
          class="absolute right-3 sm:right-6 md:right-8 top-1/2 -translate-y-1/2
                 w-9 h-9 sm:w-11 sm:h-11 md:w-12 md:h-12
                 bg-black/70 hover:bg-black/90 backdrop-blur-md rounded-2xl
                 flex items-center justify-center text-white text-2xl md:text-3xl z-30 shadow-lg">
          →
        </button>
      </div>

      <div id="project-dots"
           class="flex justify-center items-center gap-3 mt-6 md:mt-8"
           role="group"
           aria-label="Choose a project"></div>
      <p id="project-status" class="sr-only" aria-live="polite" aria-atomic="true"></p>
    </div>
  </div>
</section>
